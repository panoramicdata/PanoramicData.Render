<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PanoramicData.Render.Demo</title>
    <base id="app-base" href="/" />
    <script>
        (() => {
            const baseElement = document.getElementById("app-base");
            if (!baseElement) {
                return;
            }

            const isLocalHost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
            if (isLocalHost) {
                baseElement.setAttribute("href", "/");
                return;
            }

            if (window.location.hostname.endsWith(".github.io")) {
                const segments = window.location.pathname.split("/").filter(Boolean);
                if (segments.length > 0) {
                    baseElement.setAttribute("href", `/${segments[0]}/`);
                    return;
                }
            }

            baseElement.setAttribute("href", "/");
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PanoramicData.Render.Demo.styles.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs" type="module"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.demoDownload = {
            downloadBytes: (fileName, mimeType, base64Payload) => {
                const link = document.createElement("a");
                link.href = `data:${mimeType};base64,${base64Payload}`;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                link.remove();
            }
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/visual-diff.js"></script>
</body>

</html>
