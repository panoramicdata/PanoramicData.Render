name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install WebAssembly tooling
      run: dotnet workload install wasm-tools

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Pack
      run: dotnet pack PanoramicData.Render/PanoramicData.Render.csproj --no-build --configuration Release --output ./artifacts

    - name: Upload NuGet artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: nuget
        path: ./artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: NuGet Login (Trusted Publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: david_n_m_bond

    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  deploy_pages:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install WebAssembly tooling
      run: dotnet workload install wasm-tools

    - name: Publish demo app
      run: dotnet publish PanoramicData.Render.Demo/PanoramicData.Render.Demo.csproj --configuration Release

    - name: Ensure .nojekyll in publish output
      run: touch PanoramicData.Render.Demo/bin/Release/net10.0/publish/wwwroot/.nojekyll

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: PanoramicData.Render.Demo/bin/Release/net10.0/publish/wwwroot

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
